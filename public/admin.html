<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KamX Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Inter", sans-serif;
    background: #F5F7FB; color: #0D1333;
  }
  .topbar {
    background: #1A237E; color: white; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .topbar button {
    background: rgba(255,255,255,0.15); border: none; color: white;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .login-box {
    max-width: 360px; margin: 80px auto; background: white; padding: 30px;
    border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
  }
  .login-box input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #E5E8F5;
    font-size: 14px; margin: 16px 0; box-sizing: border-box; outline: none;
  }
  .login-box button {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: #FF6B35; color: white; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .error { color: #E53935; font-size: 13px; margin-top: 8px; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .stat-card {
    background: white; border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px rgba(20,20,60,0.05);
  }
  .stat-card .label { font-size: 12px; color: #8A8FB3; margin-bottom: 6px; }
  .stat-card .value { font-size: 24px; font-weight: 800; color: #1A237E; }
  .section { margin-bottom: 28px; }
  .section h2 { font-size: 15px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #EEF0F7; }
  th { background: #F5F7FB; color: #8A8FB3; font-weight: 600; }
  .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge.online { background: #00C85322; color: #00C853; }
  .badge.offline { background: #8A8FB322; color: #8A8FB3; }
  .badge.partner { background: #FF6B3522; color: #FF6B35; }
  .badge.paid { background: #00C85322; color: #00C853; }
  .badge.unpaid { background: #E5393522; color: #E53935; }
  .refresh-note { font-size: 12px; color: #8A8FB3; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    padding: 8px 16px; border-radius: 8px; border: 1.5px solid #E5E8F5; background: white;
    cursor: pointer; font-size: 13px; font-weight: 600; color: #8A8FB3;
  }
  .tab-btn.active { background: #1A237E; color: white; border-color: #1A237E; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const API_URL = "PLACEHOLDER_API_URL"; // replaced below at build time if needed

function getApiUrl() {
  // Allow overriding via ?api=https://your-backend-url at runtime, else use the configured default.
  const params = new URLSearchParams(window.location.search);
  return params.get("api") || localStorage.getItem("kamx_admin_api") || API_URL;
}

function getPassword() {
  return sessionStorage.getItem("kamx_admin_pw") || "";
}
function setPassword(pw) {
  sessionStorage.setItem("kamx_admin_pw", pw);
}

async function adminFetch(path) {
  const res = await fetch(getApiUrl() + path, {
    headers: { "x-admin-password": getPassword() },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || "Request failed");
  }
  return res.json();
}

const app = document.getElementById("app");

function renderLogin(errorMsg) {
  app.innerHTML = `
    <div class="login-box">
      <div style="width:50px;height:50px;border-radius:14px;background:#FF6B35;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:white;font-weight:800;font-size:20px;font-family:sans-serif;">K</div>
      <h2 style="margin:0 0 4px;">KamX Admin</h2>
      <div style="font-size:12px;color:#8A8FB3;">Sirf aapke liye — apna admin password daalein</div>
      <input id="pw" type="password" placeholder="Admin password" />
      <input id="apiUrlInput" type="text" placeholder="Backend URL (e.g. https://web-production-xxxx.up.railway.app)" value="${getApiUrl() === 'PLACEHOLDER_API_URL' ? '' : getApiUrl()}" style="font-size:12px;" />
      <button id="loginBtn">Login</button>
      ${errorMsg ? `<div class="error">${errorMsg}</div>` : ""}
    </div>
  `;
  document.getElementById("loginBtn").onclick = async () => {
    const pw = document.getElementById("pw").value;
    const apiUrlVal = document.getElementById("apiUrlInput").value.trim();
    if (apiUrlVal) localStorage.setItem("kamx_admin_api", apiUrlVal);
    setPassword(pw);
    try {
      await adminFetch("/admin/stats");
      renderDashboard();
    } catch (e) {
      renderLogin(e.message || "Login failed — password ya backend URL check karein");
    }
  };
}

let currentTab = "users";

async function renderDashboard() {
  app.innerHTML = `
    <div class="topbar">
      <h1>KamX Admin Dashboard</h1>
      <button id="logoutBtn">Logout</button>
    </div>
    <div class="container">
      <div class="refresh-note">Auto-loaded just now. <a href="#" id="refreshLink">Refresh</a></div>
      <div id="statsGrid" class="stats-grid"></div>
      <div class="tabs">
        <button class="tab-btn" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="bookings">Bookings</button>
      </div>
      <div id="tabContent"></div>
    </div>
  `;
  document.getElementById("logoutBtn").onclick = () => {
    sessionStorage.removeItem("kamx_admin_pw");
    renderLogin();
  };
  document.getElementById("refreshLink").onclick = (e) => { e.preventDefault(); loadAll(); };
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.onclick = () => { currentTab = btn.dataset.tab; renderTabs(); loadTabContent(); };
  });
  renderTabs();
  await loadAll();
}

function renderTabs() {
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === currentTab);
  });
}

async function loadAll() {
  try {
    const stats = await adminFetch("/admin/stats");
    document.getElementById("statsGrid").innerHTML = `
      <div class="stat-card"><div class="label">Total Users</div><div class="value">${stats.total_users}</div></div>
      <div class="stat-card"><div class="label">Total Partners</div><div class="value">${stats.total_partners}</div></div>
      <div class="stat-card"><div class="label">Online Now</div><div class="value">${stats.online_partners}</div></div>
      <div class="stat-card"><div class="label">Total Bookings</div><div class="value">${stats.total_bookings}</div></div>
      <div class="stat-card"><div class="label">Paid Bookings</div><div class="value">${stats.paid_bookings}</div></div>
      <div class="stat-card"><div class="label">Total Revenue</div><div class="value">₹${stats.total_revenue}</div></div>
      <div class="stat-card"><div class="label">KamX Commission Earned</div><div class="value">₹${stats.total_commission_earned}</div></div>
    `;
    await loadTabContent();
  } catch (e) {
    alert("Could not load data: " + e.message);
  }
}

async function loadTabContent() {
  const el = document.getElementById("tabContent");
  if (currentTab === "users") {
    const users = await adminFetch("/admin/users");
    el.innerHTML = `
      <table>
        <thead><tr><th>Name</th><th>Contact</th><th>Type</th><th>Service</th><th>City</th><th>Commission</th><th>Status</th><th>Joined</th></tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${u.name}</td>
              <td>${u.email || u.phone || "-"}</td>
              <td>${u.is_partner ? '<span class="badge partner">Partner</span>' : "Customer"}</td>
              <td>${u.partner_service || "-"}</td>
              <td>${u.partner_city || "-"}</td>
              <td>${u.is_partner ? u.partner_commission + "%" : "-"}</td>
              <td>${u.is_partner ? (u.partner_online ? '<span class="badge online">Online</span>' : '<span class="badge offline">Offline</span>') : "-"}</td>
              <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : "-"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } else {
    const bookings = await adminFetch("/admin/bookings");
    el.innerHTML = `
      <table>
        <thead><tr><th>Customer</th><th>Partner</th><th>Service</th><th>Price</th><th>Commission</th><th>Worker Gets</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>
          ${bookings.map(b => `
            <tr>
              <td>${b.customer_name}</td>
              <td>${b.partner_name || "Unassigned"}</td>
              <td>${b.service_key}</td>
              <td>₹${b.price}</td>
              <td>₹${b.commission_amt} (${b.commission_pct}%)</td>
              <td>₹${b.worker_amt}</td>
              <td>${b.paid ? '<span class="badge paid">Paid</span>' : '<span class="badge unpaid">Unpaid</span>'} ${b.status}</td>
              <td>${b.created_at ? new Date(b.created_at).toLocaleDateString() : "-"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }
}

// Boot
if (getPassword()) {
  adminFetch("/admin/stats").then(renderDashboard).catch(() => renderLogin());
} else {
  renderLogin();
}
</script>
</body>
</html>
